services:
  - type: web
    name: videohub-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DATA_DIR
        value: /tmp/videohub
      - key: JOB_TTL_SECONDS
        value: "3600"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: CORS_ORIGIN
        value: "*"
